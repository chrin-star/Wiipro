name: Build Wii DOL

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect Wii USB API
        run: |
          echo "=== USB functions ==="
          grep -nE 'USB_(OpenDevice|CloseDevice|Read|Write|Ctrl|GetDescriptors|GetDeviceList)' /opt/devkitpro/libogc/include/ogc/usb.h || true

          echo "=== USB header ==="
          sed -n '1,240p' /opt/devkitpro/libogc/include/ogc/usb.h

      - name: Compile
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: wii-pro-detector
          path: boot.dol
          
